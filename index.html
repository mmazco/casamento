<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Portuguese azulejo artwork in cobalt blue on white porcelain with a pale yellow border.">
  <title>Maryam and Gabriel — Casamento em Lisboa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="invitation-heading"><span class="invitation-intro">You are invited to</span><span class="couple-names">Maryam and Gabriel’s</span><span class="invitation-location">casamento em Lisboa</span></h1>
    <button class="rsvp-button" type="button" data-open="rsvp-details" aria-haspopup="dialog">RSVP</button>
  </header>
  <main id="invitation">
    <figure class="artwork">
      <div class="tile-panel">
        <img src="assets/mural-subtle-balanced-detail.png" alt="An ornate Portuguese azulejo mural with continuous blue-and-white scenes of Café des Épices and Fábrica Braço de Prata beside the river, the Santa Cruz sea boulder, classical scrollwork, and a pale yellow border.">
        <img class="cafe-restoration" src="assets/mural-balanced-terrace.png" alt="" aria-hidden="true">
        <img class="santa-cloud-cleanup" src="assets/mural-santa-cruz-no-clouds.png" alt="" aria-hidden="true">
        <div class="plan-tile ceremony-tile" role="group" aria-label="Café des Épices">
          <button class="tile-flip" type="button" aria-label="Ceremony at Café des Épices, 16:00 Lisboa local time. Flip the four café tiles." aria-pressed="false"></button>
          <span class="plan-tile-inner">
            <span class="plan-tile-front" aria-hidden="true"></span>
            <span class="plan-tile-back" aria-hidden="true">
              <span class="tile-title">Ceremony</span>
              <a class="tile-venue tile-venue-map" href="https://maps.app.goo.gl/PCJgbVCytkj3mCLs5" target="_blank" rel="noopener noreferrer" tabindex="-1">Café des Épices</a>
              <span class="tile-time">16:00</span>
              <span class="tile-timezone">Lisboa local time</span>
            </span>
          </span>
        </div>
        <div class="plan-tile reception-tile" role="group" aria-label="Fábrica Braço de Prata">
          <button class="tile-flip" type="button" aria-label="Dinner and party at Fábrica Braço de Prata, from 18:00 Lisboa local time. Flip the four Fábrica tiles." aria-pressed="false"></button>
          <span class="plan-tile-inner">
            <span class="plan-tile-front" aria-hidden="true"></span>
            <span class="plan-tile-back" aria-hidden="true">
              <span class="tile-title">Dinner &amp; party</span>
              <a class="tile-venue tile-venue-map" href="https://maps.app.goo.gl/w3x1JGbmVdjdVDba6" target="_blank" rel="noopener noreferrer" tabindex="-1">Fábrica Braço de Prata</a>
              <span class="tile-time">From 18:00</span>
              <span class="tile-timezone">Lisboa local time</span>
            </span>
          </span>
        </div>
        <div class="plan-tile getaway-tile" role="group" aria-label="Santa Cruz getaway">
          <button class="tile-flip" type="button" aria-label="After the wedding: a few days in Santa Cruz, by invitation. Flip the two coastal tiles." aria-pressed="false"></button>
          <span class="plan-tile-inner">
            <span class="plan-tile-front" aria-hidden="true"></span>
            <span class="plan-tile-back" aria-hidden="true">
              <span class="tile-title">After the wedding</span>
              <span class="tile-venue">Santa Cruz</span>
              <span class="tile-getaway-note">A few days by the sea · By invitation</span>
            </span>
          </span>
        </div>
      </div>
      <figcaption class="artwork-credit"><a href="https://www.instagram.com/dacostaworld" target="_blank" rel="noopener noreferrer">Original artwork by @dacostaworld</a></figcaption>
    </figure>
  </main>
  <dialog id="day-details" aria-labelledby="day-title"><button class="dialog-close" type="button" aria-label="Close details">×</button><h2 id="day-title">Our day</h2><p class="event-label">The ceremony</p><p><a href="https://maps.app.goo.gl/PCJgbVCytkj3mCLs5" target="_blank" rel="noopener noreferrer">Café des Épices Lisboa ↗</a></p><p class="event-label">Dinner &amp; party</p><p><a href="https://maps.app.goo.gl/w3x1JGbmVdjdVDba6" target="_blank" rel="noopener noreferrer">Fábrica Braço de Prata ↗</a></p><p class="details-note">Marvila, Lisboa<br>Date and timings to follow.</p></dialog>
  <dialog id="rsvp-details" aria-labelledby="rsvp-title"><button class="dialog-close" type="button" aria-label="Close RSVP">×</button><h2 id="rsvp-title">RSVP</h2><p>We can’t wait to celebrate with you.</p><p class="details-note">RSVP details are coming soon.</p></dialog>
  <script src="app.js"></script>
</body>
</html>
